<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b08"><title>ร้านเถ้าแก่ของเก่า — Atelier Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#100b09;--panel:#21140e;--panel2:#2d1c13;--gold:#d8b66c;--gold2:#f3dfa4;--cream:#f2e6cd;--muted:#c3ad8b;--wine:#692432;--green:#284536;--line:#88683c}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:Sarabun,system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,#634024 0,transparent 36%),radial-gradient(ellipse at 100% 55%,#38192266,transparent 35%),linear-gradient(135deg,#100b09,#29170f 48%,#100b09);padding:0 0 calc(35px + env(safe-area-inset-bottom))}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background:repeating-linear-gradient(90deg,transparent 0 78px,#d8b66c22 79px 80px,transparent 81px 158px),repeating-linear-gradient(0deg,transparent 0 98px,#0004 99px 101px,transparent 102px 200px)}.topline{height:5px;background:linear-gradient(90deg,#40131c,#9a7139,#f3dfa4,#9a7139,#40131c);box-shadow:0 5px 25px #0009}.wrap{position:relative;width:min(100%,620px);margin:auto;padding:16px 15px 35px}.mast{margin:12px 5px 25px;text-align:center;padding:18px 12px 16px;border:1px solid var(--gold);outline:1px solid #76552b;outline-offset:4px;background:linear-gradient(135deg,#42271a,#160d09 68%,#2b1911);box-shadow:0 18px 40px #0009,inset 0 1px #fff2}.eyebrow{font-size:10px;letter-spacing:3px;color:#c6a568;text-transform:uppercase}.mast h1{margin:5px 0 2px;color:var(--gold2);font:700 clamp(24px,6vw,34px) 'Playfair Display',serif;letter-spacing:.5px}.mast p{margin:0;font-size:11px;color:#c5ad83;letter-spacing:1.5px}.stats{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:0 0 13px}.daybox,.cashbox,.iconbtn{border:1px solid #8c6b3c;background:linear-gradient(145deg,#332217,#120c09);box-shadow:0 7px 18px #0005}.daybox{padding:8px 10px;font-size:12px;color:#e8d7b5}.progress{height:4px;background:#ffffff22;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8b632c,#f3d994);transition:width .3s}.cashbox{padding:8px 10px;color:var(--gold2);font-weight:800;font-size:14px;white-space:nowrap}.iconbtn{padding:8px 10px;color:var(--gold2);border-radius:0;font-size:16px}.notice{min-height:25px;color:#c7b18d;font-size:12px;line-height:1.6;margin:0 2px 10px}.panel{position:relative;overflow:hidden;border:1px solid var(--gold);background:radial-gradient(ellipse at 50% 35%,#c39b4820,transparent 48%),linear-gradient(145deg,#2c1b13,#140d0a 58%,#26170f);box-shadow:0 22px 48px #0009,inset 0 0 0 5px #d5b46c0a;padding:15px}.panel:before{content:"";position:absolute;inset:8px;border:1px solid #d8b56c35;pointer-events:none}.customer{position:relative;display:flex;gap:11px;align-items:center}.portrait{flex:0 0 54px;width:54px;height:54px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 25%,#9a7446,#291a12 72%);box-shadow:0 0 0 4px #d3ad5b16,0 8px 18px #0008}.speech{flex:1;padding:10px 12px;border:1px solid #d7b66e;background:linear-gradient(135deg,#f3e6c7,#d7c095);color:#352216;font-size:13px;line-height:1.65;border-radius:2px 12px 2px 12px}.display{position:relative;text-align:center;min-height:260px;margin:16px -4px 0;padding:24px 8px 15px;border-top:1px solid #d0aa5a44;border-bottom:1px solid #d0aa5a44;background:radial-gradient(ellipse at 50% 42%,#e8bd6424,transparent 44%),linear-gradient(180deg,#0002,transparent 28%,#0003)}.halo{position:absolute;top:-18px;left:50%;width:270px;height:230px;transform:translateX(-50%);background:radial-gradient(ellipse,#ffe4a33b,#d6a54b12 42%,transparent 72%);pointer-events:none}.artifact{position:relative;display:flex;align-items:center;justify-content:center;width:150px;height:135px;margin:0 auto 5px;font-size:88px;filter:drop-shadow(0 18px 10px #0009) drop-shadow(0 0 22px #f1d17a44);animation:float 4s ease-in-out infinite}.pedestal{position:relative;width:170px;height:13px;margin:-3px auto 15px;border:1px solid #e2c477;border-radius:50%;background:linear-gradient(#f5e3b2,#b68b42 40%,#2a1a10);box-shadow:0 5px #3b2413,0 10px 20px #0009}.itemname{color:var(--gold2);font:700 25px 'Playfair Display',serif;margin:9px 0 4px}.rarity{font-size:10px;color:#d7b977;letter-spacing:1.6px}.desc{font-size:12px;color:#c3b091;line-height:1.8;margin-top:4px}.price{display:inline-block;margin-top:12px;padding:6px 22px;border:1px solid #c8a45e;background:linear-gradient(135deg,#f8eac6,#d6b977);color:#392314;font-weight:800;font-size:20px;box-shadow:0 4px #6b4b25}.claim{max-width:350px;margin:10px auto 0;padding:8px 10px;border:1px dashed #b08c50;background:#f5e9cb;color:#5c452a;font-size:12px}.actions{display:grid;gap:8px;margin-top:17px}.btn{min-height:45px;padding:11px 10px;border:1px solid #80603b;border-bottom-width:3px;border-radius:2px;background:linear-gradient(#f5e9cf,#d9c49a);color:#352315;font:700 14px Sarabun, sans-serif;box-shadow:0 6px 14px #0003;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#8f293a,#541522);border-color:#4a1420;color:#fff0d2}.btn:disabled{opacity:.4}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shelf{margin-top:20px;padding:14px 12px 6px;border:1px solid #b89452;background:linear-gradient(145deg,#2b4031,#101e17);box-shadow:0 15px 30px #0006}.shelf h2{margin:0 0 12px;color:#f1d58c;font:600 17px 'Playfair Display',serif;letter-spacing:.5px}.inventory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{min-width:0;min-height:83px;text-align:center;padding:7px 2px 5px;background:#ffffff08;border-bottom:6px solid #684626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.slot .emoji{font-size:30px;filter:drop-shadow(0 5px 4px #0007)}.slot small{font-size:9px;color:#e1cda5}.slot.empty{opacity:.25;font-size:22px}.foot{text-align:center;color:#bca982;font-size:11px;line-height:1.8;margin-top:14px}.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}.modal.show{display:flex}.dialog{width:min(100%,420px);padding:20px;border:1px solid var(--gold);background:linear-gradient(145deg,#302016,#130c09);box-shadow:0 20px 60px #000c}.dialog h2{margin:0 0 8px;color:var(--gold2);font:700 23px 'Playfair Display',serif}.dialog p{color:#cbb792;font-size:13px;line-height:1.7}.dialog input{width:100%;padding:12px;background:#160e0a;color:#f5e8cf;border:1px solid var(--gold);font:inherit;margin:5px 0 12px}.end{text-align:center}.end .trophy{font-size:72px}.end h2{font:700 27px 'Playfair Display',serif;color:var(--gold2)}.toast{position:fixed;z-index:10;left:50%;bottom:25px;transform:translateX(-50%);padding:10px 18px;background:#f2e0b6;color:#321f12;font-weight:800;box-shadow:0 8px 30px #0009;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(max-width:380px){.wrap{padding-left:11px;padding-right:11px}.mast h1{font-size:23px}.cashbox{font-size:12px;padding:8px}.display{min-height:240px}.artifact{height:115px;font-size:78px}.slot{min-height:72px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="topline"></div><main class="wrap"><header class="mast"><div class="eyebrow">THE ANTIQUE ATELIER · EST. 1924</div><h1>ร้านเถ้าแก่ของเก่า</h1><p>CURATED OBJECTS · STORIES · VALUE</p></header><section class="stats"><div class="daybox" id="daybox">วันที่ 1 / 30<div class="progress"><i id="progress" style="width:0%"></i></div></div><button class="iconbtn" id="sound" aria-label="เสียง">🔊</button><div class="cashbox" id="cash">฿1,000</div></section><div class="notice" id="notice">ยินดีต้อนรับเถ้าแก่ เปิดร้านแล้วเลือกซื้อขายให้คุ้มค่า!</div><section id="game"></section><section class="shelf"><h2>✦ คลังสะสมของร้าน <span id="count">(0)</span></h2><div class="inventory" id="inventory"></div></section><div class="foot">ค่าเช่าร้าน ฿100 ทุกวันที่ 7, 14, 21 และ 28 · บริหารเงินให้รอดครบ 30 วัน</div></main><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>
<script>
const ITEMS=[
 {name:'แหวนทับทิมโบราณ',emoji:'💍',base:620,desc:'แหวนทองฝังทับทิม งานช่างยุคเก่า',rarity:'RARE JEWELRY'},
 {name:'แจกันหยกขาว',emoji:'🏺',base:480,desc:'เครื่องหยกเนื้อเนียน ลวดลายละเอียด',rarity:'JADE COLLECTION'},
 {name:'นาฬิกาพกทอง',emoji:'⌚',base:850,desc:'นาฬิกาพกกลไกคลาสสิก ตัวเรือนทอง',rarity:'MASTERPIECE'},
 {name:'กล้องฟิล์มวินเทจ',emoji:'📷',base:390,desc:'กล้องฟิล์มคลาสสิกจากนักสะสม',rarity:'VINTAGE OBJECT'},
 {name:'เหรียญกษาปณ์เก่า',emoji:'🪙',base:240,desc:'เหรียญเก่าที่มีเรื่องราวทางประวัติศาสตร์',rarity:'HISTORICAL FIND'},
 {name:'กล่องดนตรีไม้',emoji:'🎼',base:330,desc:'กล่องดนตรีแกะสลัก เสียงหวานนุ่ม',rarity:'HANDCRAFTED'},
 {name:'ถ้วยชาลายคราม',emoji:'🍵',base:180,desc:'เครื่องถ้วยลายครามสไตล์คลาสสิก',rarity:'PORCELAIN'},
 {name:'เข็มกลัดอัญมณี',emoji:'📿',base:570,desc:'เข็มกลัดประดับพลอยสำหรับนักสะสม',rarity:'RARE JEWELRY'},
 {name:'ตะเกียงเจ้าพายุ',emoji:'🏮',base:210,desc:'ตะเกียงโลหะเก่า ผ่านการใช้งานมาอย่างดี',rarity:'PERIOD PIECE'},
 {name:'หนังสือปกหนัง',emoji:'📕',base:260,desc:'หนังสือปกหนังเก่า กระดาษสีงาช้าง',rarity:'ARCHIVE'},
 {name:'รูปปั้นทองเหลือง',emoji:'🗿',base:440,desc:'งานหล่อทองเหลืองผิวเก่า มีเอกลักษณ์',rarity:'DECORATIVE ART'},
 {name:'กล่องไม้สัก',emoji:'🪵',base:150,desc:'กล่องไม้สักงานฝีมือ ขนาดกะทัดรัด',rarity:'CRAFT OBJECT'}
];
const CUSTOMERS=[{name:'คุณหญิงมาลี',emoji:'👒',say:'เถ้าแก่คะ ช่วยดูของชิ้นนี้ให้หน่อยค่ะ'},{name:'นักสะสมรุ่นใหญ่',emoji:'🧐',say:'ของแบบนี้ไม่ได้เจอกันง่าย ๆ นะคุณ'},{name:'พ่อค้าจากตลาดเก่า',emoji:'🧔🏻',say:'มีของดีมาฝาก ลองประเมินดูสิ'},{name:'นักเดินทาง',emoji:'🧳',say:'ผมเก็บชิ้นนี้มาจากการเดินทางไกล'},{name:'คุณชายภาคิน',emoji:'🎩',say:'ถ้าถูกใจ ผมพร้อมคุยราคากันครับ'},{name:'แม่ค้าของสะสม',emoji:'👩🏻‍🦳',say:'ของเก่าต้องดูให้เป็นนะเถ้าแก่'}];
const $=id=>document.getElementById(id);const money=n=>'฿'+Math.round(n).toLocaleString('th-TH');let state,muted=false,shopName='';
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[rand(0,a.length-1)]}function itemCopy(){let x=pick(ITEMS);return {...x,id:Math.random().toString(36).slice(2),base:x.base,paid:0,value:x.base,fake:false}}
function start(){state={day:1,cash:1000,inv:[],event:null,done:false,profit:0,history:[]};newEvent();render();$('notice').textContent='ร้านเปิดแล้ว! เลือกซื้อของจากลูกค้า หรือขายของในคลังเพื่อทำกำไร';}
function newEvent(){if(state.day>30){finish();return}let selling=state.inv.length>0&&Math.random()<.43;let customer=pick(CUSTOMERS);if(selling){let it=pick(state.inv);let offer=Math.round(it.value*(rand(105,145)/100));state.event={type:'sell',it,customer,offer,hag:false,say:pick(['ผมอยากได้ชิ้นนี้ เสนอให้ '+money(offer)+' ครับ','ของชิ้นนี้เข้ากับคอลเลกชันผมมาก','ถ้าเถ้าแก่ยอมขาย ผมพร้อมจ่ายวันนี้'])};}else{let it=itemCopy();it.fake=Math.random()<.13;it.value=Math.round(it.base*(it.fake?.18:rand(78,125)/100));let ask=Math.round(it.value*(rand(115,155)/100));state.event={type:'buy',it,customer,ask,hag:false,say:pick(['มีของเก่าหายากมานำเสนอครับ','เถ้าแก่ช่วยประเมินให้หน่อยนะ','ของชิ้นนี้เป็นของดีจากบ้านเก่าของผม'])};}}
function render(){if(state.done){renderEnd();return}let e=state.event,it=e.it;let desc=e.type==='buy'?`ผู้ขายขอ ${money(e.ask)} · ประเมินมูลค่าราว ${money(it.value)}${it.fake?' · มีความเสี่ยงเป็นของเลียนแบบ':''}`:`ลูกค้าเสนอ ${money(e.offer)} · ต้นทุนของคุณ ${money(it.paid)}`;let price=e.type==='buy'?e.ask:e.offer;$('daybox').innerHTML=`วันที่ ${state.day} / 30<div class="progress"><i id="progress" style="width:${(state.day-1)/29*100}%"></i></div>`;$('cash').textContent=money(state.cash);let actions=e.type==='buy'?`<button class="btn primary" ${state.cash<e.ask?'disabled':''} onclick="act('accept')">ซื้อในราคา ${money(e.ask)}</button><div class="btnrow"><button class="btn" ${e.hag?'disabled':''} onclick="act('haggle')">ต่อรองลด 20%</button><button class="btn" onclick="act('pass')">ไม่ซื้อ · ข้ามวัน</button></div>`:`<button class="btn primary" onclick="act('accept')">ขายให้ลูกค้า ${money(e.offer)}</button><div class="btnrow"><button class="btn" ${e.hag?'disabled':''} onclick="act('haggle')">ขอเพิ่ม 20%</button><button class="btn" onclick="act('pass')">เก็บไว้ก่อน</button></div>`;$('game').innerHTML=`<article class="panel"><div class="customer"><div class="portrait">${e.customer.emoji}</div><div class="speech"><b>${e.customer.name}</b><br>“${e.say}”</div></div><div class="display"><div class="halo"></div><div class="artifact">${it.emoji}</div><div class="pedestal"></div><div class="itemname">${it.name}</div><div class="rarity">✦ ${it.rarity} ✦</div><div class="desc">${it.desc}<br>${desc}</div>${it.fake&&e.type==='buy'?'<div class="claim">⚠️ ตรวจสอบให้ดี ของเลียนแบบอาจทำให้ขาดทุน</div>':''}<div class="price">${money(price)}</div></div><div class="actions">${actions}</div></article>`;renderInventory()}
function act(action){let e=state.event,it=e.it;if(action==='haggle'){if(e.hag){toast('ต่อรองไปแล้วในรอบนี้');return}e.hag=true;if(e.type==='buy'){e.ask=Math.max(30,Math.round(e.ask*.8));e.say='ลดให้ได้ครับ ราคานี้พอไหวไหม?'}else{e.offer=Math.round(e.offer*1.2);e.say='เอาอย่างนี้ ผมเพิ่มให้อีก 20% แล้วกัน!'}render();return}if(action==='accept'){if(e.type==='buy'){if(state.cash<e.ask){toast('เงินสดไม่พอครับ');return}state.cash-=e.ask;it.paid=e.ask;state.inv.push(it);state.history.push(`ซื้อ ${it.name} ${money(e.ask)}`);let diff=it.value-e.ask;state.profit+=diff;$('notice').textContent=it.fake?'ซื้อมาแล้ว แต่มีโอกาสเป็นของเลียนแบบ! ระวังขาดทุน':'รับของเข้าร้านแล้ว '+it.name+' · '+(diff>=0?'มูลค่าประเมินสูงกว่าทุน '+money(diff):'ต้องหาจังหวะขายให้ดี');toast(it.fake?'ระวังของเลียนแบบ!':'รับเข้าคลังแล้ว');}else{state.cash+=e.offer;state.inv=state.inv.filter(x=>x.id!==it.id);let gain=e.offer-it.paid;state.profit+=gain;state.history.push(`ขาย ${it.name} ${money(e.offer)}`);$('notice').textContent=`ขายสำเร็จ ${it.name} · ${gain>=0?'กำไร ':'ขาดทุน '}${money(Math.abs(gain))}`;toast(gain>=0?'ขายได้กำไร!':'ขายขาดทุน');}}else if(action==='pass'){$('notice').textContent='ปล่อยดีลนี้ผ่านไป บางครั้งการไม่ซื้อก็เป็นกำไร';}nextDay()}
function nextDay(){if(state.day%7===0&&[7,14,21,28].includes(state.day)){state.cash-=100;$('notice').textContent+=' · จ่ายค่าเช่าร้าน ฿100';}state.day++;if(state.cash<0){state.done=true;render();return}if(state.day>30){state.done=true;render();return}newEvent();render()}
function renderInventory(){let list=state.inv.slice(0,16);$('count').textContent=`(${state.inv.length})`;$('inventory').innerHTML=Array.from({length:Math.max(8,Math.ceil(list.length/4)*4)},(_,i)=>{let it=list[i];return it?`<div class="slot"><span class="emoji">${it.emoji}</span><small>${it.name}</small><small>ทุน ${money(it.paid)}</small></div>`:'<div class="slot empty">✧</div>'}).join('')}
function finish(){state.done=true;render()}function renderEnd(){let stock=state.inv.reduce((n,it)=>n+it.value*.5,0),total=state.cash+stock,net=total-1000;let rank=net<0?'พ่อค้ามือใหม่ที่ต้องฝึก':net<500?'เถ้าแก่ใจเย็น':net<1500?'นักสะสมผู้ชาญฉลาด':'เจ้าของแกลเลอรีชั้นนำ';$('cash').textContent=money(state.cash);$('daybox').textContent='จบการบริหาร 30 วัน';$('notice').textContent='ปิดร้านเพื่อสรุปผลประกอบการ';$('game').innerHTML=`<article class="panel end"><div class="trophy">${net<0?'🕯️':net<1500?'🏆':'👑'}</div><h2>ครบ 30 วัน</h2><p>${rank}</p><div class="desc">เงินสดคงเหลือ <b>${money(state.cash)}</b><br>มูลค่าคลัง (ประเมินครึ่งหนึ่ง) <b>${money(stock)}</b></div><div class="price">สินทรัพย์รวม ${money(total)}</div><p class="desc">ผลต่างจากทุนเริ่มต้น ${money(net)}</p><button class="btn primary" style="width:100%;margin-top:15px" onclick="start()">เปิดร้านใหม่อีกครั้ง</button></article>`;renderInventory()}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';toast(muted?'ปิดเสียง':'เปิดเสียง')};start();
</script></body></html>
