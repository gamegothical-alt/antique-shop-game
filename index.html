<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านเถ้าแก่ของเก่า — Cinematic Luxury</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Mitr:wght@400;500&family=Sarabun:wght@400;600;800&display=swap">
<style>
:root{--w1:#f3e3c3;--w2:#e8d2a6;--ink:#3a2412;--wood:#a8692f;--wood2:#7d4a1e;--card:#fff7e6;--acc:#b5651d;--good:#2f7d3a;--bad:#b3392b;--mute:#7d6247;--glow:rgba(255,196,80,.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#2b1d12;--w2:#21160d;--ink:#f6e7cc;--wood:#8a5428;--wood2:#5e3818;--card:#3a281a;--acc:#f0b35a;--good:#7ddc88;--bad:#f28a7b;--mute:#c2a888;--glow:rgba(255,190,80,.3)}}
:root[data-theme="dark"]{--w1:#2b1d12;--w2:#21160d;--ink:#f6e7cc;--wood:#8a5428;--wood2:#5e3818;--card:#3a281a;--acc:#f0b35a;--good:#7ddc88;--bad:#f28a7b;--mute:#c2a888;--glow:rgba(255,190,80,.3)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Sarabun",system-ui,-apple-system,"Noto Sans Thai",sans-serif;line-height:1.45;background:repeating-linear-gradient(90deg,var(--w1) 0 38px,var(--w2) 38px 40px);min-height:100vh}
.awn{height:40px;background:repeating-linear-gradient(90deg,#c0392b 0 28px,#fdf3dc 28px 56px);position:relative;margin-bottom:16px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.awn::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 14px 0,#c0392b 14px,transparent 15px) 0 0/56px 14px repeat-x,radial-gradient(circle at 42px 0,#fdf3dc 14px,transparent 15px) 0 0/56px 14px repeat-x;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.w{max-width:480px;margin:0 auto;padding:6px 14px 24px}
.sign{width:max-content;max-width:100%;margin:6px auto 14px;background:linear-gradient(var(--wood),var(--wood2));color:#fdf3dc;font-family:"Mitr",sans-serif;font-size:20px;padding:6px 22px;border-radius:10px;border:3px solid #4a2a10;box-shadow:0 4px 0 rgba(0,0,0,.25);text-align:center}
.stat{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-weight:800}
.day{flex:1;font-size:14px}
.trk{height:10px;background:rgba(125,74,30,.25);border-radius:9px;margin-top:6px;position:relative}
.trk b{display:block;height:100%;background:linear-gradient(90deg,#f6b73c,#e07b1a);border-radius:9px;transition:width .5s}
.trk span{position:absolute;top:-8px;font-size:20px;transform:translateX(-50%);transition:left .5s}
.cash{font-family:"Mitr",sans-serif;font-size:22px;background:var(--card);border:2px solid var(--wood2);border-radius:12px;padding:2px 12px}
.msg{font-size:14px;color:var(--mute);min-height:42px;margin-bottom:8px}
.scene{position:relative;background:radial-gradient(ellipse at 50% 55%,var(--glow),transparent 62%),var(--card);border:3px solid var(--wood2);border-radius:18px;padding:14px 14px 16px;overflow:hidden;box-shadow:0 5px 0 var(--wood2)}
.cus{display:flex;gap:10px;align-items:center;animation:in .4s}
.av{font-size:34px;width:56px;height:56px;border-radius:50%;background:var(--w2);border:2px solid var(--wood2);display:grid;place-items:center;flex:none}
.bub{position:relative;background:#fffdf6;color:#3a2412;border:2px solid #cdb48a;border-radius:14px;padding:8px 12px;font-size:14px}
.bub::before{content:"";position:absolute;left:-9px;top:20px;border:8px solid transparent;border-right-color:#cdb48a;border-left:0}
.stage{position:relative;text-align:center;padding:14px 0 4px;animation:in .5s}
.it{font-size:88px;line-height:1;display:inline-block;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ped{width:150px;height:16px;margin:2px auto 0;background:radial-gradient(ellipse,var(--wood) 0 60%,var(--wood2) 100%);border-radius:50%;box-shadow:0 4px 0 var(--wood2)}
.nm{font-family:"Mitr",sans-serif;font-size:20px;margin-top:8px}
.sub{font-size:13px;color:var(--mute)}
.tag{position:relative;display:inline-block;margin-top:8px;background:#fdf3dc;color:#3a2412;border:2px solid #c9a56a;border-radius:6px 16px 16px 6px;padding:2px 16px 2px 22px;font-family:"Mitr",sans-serif;font-size:24px}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--wood2)}
.it svg,.slot svg{display:block}
.sp{position:absolute;font-style:normal;font-size:20px;animation:tw 1.8s ease-in-out infinite}
.btns{display:grid;gap:8px;margin-top:14px}
button{font:inherit;font-weight:800;padding:11px;border-radius:12px;border:2px solid var(--wood2);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
button:active{transform:translateY(3px);border-bottom-width:2px}
button.p{background:linear-gradient(#e0903a,var(--acc));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
button:disabled{opacity:.4}
.shelf{margin-top:14px;background:rgba(0,0,0,.06);border:3px solid var(--wood2);border-radius:14px;padding:10px 10px 4px}
.shelf h3{margin:0 0 6px;font-family:"Mitr",sans-serif;font-size:15px;font-weight:500}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:9px solid var(--wood);box-shadow:0 3px 0 var(--wood2);margin-bottom:12px}
.slot{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:34px;line-height:1}
.slot small{font-size:10px;color:var(--mute);font-weight:600}
.slot.e{opacity:.25;font-size:20px}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
.pop{position:absolute;left:50%;top:45%;font-family:"Mitr",sans-serif;font-size:30px;white-space:nowrap;animation:rise 1.3s forwards;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pop.good{color:var(--good)}.pop.bad{color:var(--bad)}
.cert{margin:10px auto 0;max-width:340px;background:#fffdf6;color:#3a2412;border:2px dashed #b08a4e;border-radius:8px;padding:6px 10px;font-size:13px}
.fact{border-left:5px solid var(--wood);background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;animation:in .4s}
.fact.ok{border-color:var(--good)}.fact.no{border-color:var(--bad)}
.mu{padding:4px 8px;border-bottom-width:3px;font-size:18px}
.end{text-align:center}.end .big{font-size:80px;animation:flt 2s infinite}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-90px)}}
:root,:root:not([data-theme='light']),:root[data-theme='dark']{--w1:#eadfc4;--w2:#eadfc4;--card:#fbf3e1;--ink:#2b1b10;--acc:#8c1d2f;--wood:#6b4423;--wood2:#3e2612;--mute:#6f5a45;--good:#2f7d3a;--bad:#a8281f;--glow:rgba(255,214,120,.45)}
body{color:#f2e6c9;background-color:#18362b;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 24px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 24px),linear-gradient(#1f4034,#10231b);padding-bottom:40px}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:34px;z-index:-1;background:conic-gradient(#f4ead2 25%,#2b2b2b 0 50%,#f4ead2 0 75%,#2b2b2b 0) 0 0/34px 34px;box-shadow:0 -4px 0 #c9a24a}
.awn{background:repeating-linear-gradient(90deg,#7b1e2b 0 30px,#f4ead2 30px 60px);box-shadow:0 3px 0 #c9a24a}
.awn::after{background:radial-gradient(circle at 15px 0,#7b1e2b 15px,transparent 16px) 0 0/60px 15px repeat-x,radial-gradient(circle at 45px 0,#f4ead2 15px,transparent 16px) 0 0/60px 15px repeat-x;filter:drop-shadow(0 2px 0 #c9a24a)}
.sign{background:linear-gradient(#1a3328,#0f2019);color:#e8c96a;font-family:'Playfair Display','Mitr',serif;font-style:italic;font-size:22px;letter-spacing:.5px;padding:8px 26px;border:3px double #c9a24a;border-radius:6px;box-shadow:0 0 0 3px #0f2019,0 6px 0 rgba(0,0,0,.35);margin-top:20px}
.sign::before{content:'\2766  ';color:#c9a24a}.sign::after{content:'  \2766';color:#c9a24a}
.day,.msg{color:#e9dcc0}.foot{color:#bfae8a}.trk{background:rgba(255,255,255,.18)}
.cash{border-color:#c9a24a}
.scene{color:var(--ink);border:3px solid #c9a24a;box-shadow:0 0 0 3px #0f2019,0 8px 0 rgba(0,0,0,.35);background:radial-gradient(ellipse at 50% 50%,var(--glow),transparent 65%),var(--card)}
.fact{color:var(--ink)}
.nm{font-family:'Playfair Display','Mitr',serif}
.ped{width:120px;height:14px;border-radius:4px;background:linear-gradient(#f4f0e8,#cfc8b8);box-shadow:0 6px 0 #9a927f}
button{border-color:#3e2612;color:var(--ink)}
button.p{background:linear-gradient(#a8283b,#7b1e2b);border-color:#4a0f19;color:#fff}
.shelf{background:linear-gradient(#3a2412,#26160a);border:3px solid #c9a24a;box-shadow:0 0 0 3px #0f2019}
.shelf h3{color:#e8c96a}.row{border-bottom:9px solid #6b4423;box-shadow:0 3px 0 #1c0f05}
.slot small,.slot.e{color:#d9c8a4}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #3e2612;background:#fffdf6;color:#2b1b10;text-align:center;margin-top:10px}
.av{width:66px;height:66px;font-size:0;overflow:hidden;border:3px solid #c9a24a;background:none;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.av svg{width:100%;height:100%;display:block}
.stage::before{content:'';position:absolute;z-index:0;top:-14px;left:50%;width:250px;height:250px;margin-left:-125px;background:linear-gradient(rgba(255,236,170,.5),rgba(255,236,170,0));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);pointer-events:none}
.stage>*{position:relative;z-index:1}
.it{filter:drop-shadow(0 8px 6px rgba(0,0,0,.3)) drop-shadow(0 0 14px rgba(255,214,120,.4))}
.nm::after{content:'';display:block;width:70px;height:2px;margin:6px auto 0;background:linear-gradient(90deg,transparent,#c9a24a,transparent)}
.sp{font-size:0;width:18px;height:18px;z-index:2;background:#fff6c0;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.ped{width:130px;margin:-8px auto 0;position:relative}
.ped::before{content:'';position:absolute;z-index:-1;left:50%;top:-13px;width:104px;height:22px;margin-left:-52px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#b23a4e,#6a1626 70%);box-shadow:0 0 0 2px #c9a24a,0 3px 0 #3a0a14}
.stage>.it{z-index:3;animation:flt2 4s ease-in-out infinite}
@keyframes flt2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ===== CINEMATIC LUXURY ART DIRECTION v2 ===== */
:root{
  --night:#100b09;--mahogany:#2a1710;--mahogany2:#43271a;--brass:#d9b66d;
  --champagne:#f4dfad;--cream:#f5ead0;--wine:#5c1d2a;--soft-ink:#d9c6a0;
  color-scheme:dark;
}
html{background:#100b09;min-height:100%;-webkit-text-size-adjust:100%;}
body{
  position:relative;isolation:isolate;min-height:100vh;color:var(--cream);
  background:
    radial-gradient(ellipse at 50% -5%,rgba(212,166,87,.24),transparent 32%),
    radial-gradient(ellipse at 8% 35%,rgba(103,46,26,.23),transparent 38%),
    radial-gradient(ellipse at 94% 62%,rgba(79,24,33,.20),transparent 36%),
    repeating-linear-gradient(90deg,rgba(255,220,160,.025) 0 1px,transparent 1px 7px),
    linear-gradient(115deg,#1d100c 0%,#28170f 35%,#130d0a 72%,#24140f 100%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.34;
  background:
    repeating-linear-gradient(0deg,transparent 0 58px,rgba(0,0,0,.35) 59px 61px,transparent 62px 120px),
    repeating-linear-gradient(90deg,transparent 0 78px,rgba(218,175,100,.10) 79px 81px,transparent 82px 160px),
    radial-gradient(ellipse at 50% 12%,rgba(255,214,135,.10),transparent 50%);
  mask-image:linear-gradient(to bottom,black,transparent 94%);
}
.awn{height:8px;margin:0 0 24px;background:linear-gradient(90deg,#4b1720,#b18a48 18%,#f2d99a 50%,#b18a48 82%,#4b1720);border:0;box-shadow:0 2px 0 #4a2c17,0 8px 28px #0008}
.w{max-width:560px;padding:14px 16px calc(38px + env(safe-area-inset-bottom,0px));}
.sign{
  position:relative;width:100%;margin:10px auto 25px;padding:17px 14px 15px;
  color:#f3d993;background:
    linear-gradient(135deg,rgba(255,255,255,.07),transparent 36%),
    repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,255,255,.018) 29px 30px),
    linear-gradient(145deg,#42271a,#1a100c 70%);
  border:1px solid #d3b16a;outline:1px solid #78582d;outline-offset:4px;border-radius:2px;
  box-shadow:0 16px 34px #0009,inset 0 1px 0 #f7e2a766,inset 0 -12px 20px #0005;
  font-family:"Playfair Display","Mitr",serif;font-size:clamp(21px,5.5vw,28px);letter-spacing:.8px;text-shadow:0 2px 12px #e5b85b44;
}
.sign::before{content:"✦  ✧  ";color:#b78b43}.sign::after{content:"  ✧  ✦";color:#b78b43}
.stat{gap:9px;margin:12px 0 15px;align-items:center}
.day{color:#e9d6b2;font-size:13px;letter-spacing:.25px}
.trk{height:5px;margin-top:9px;background:#fff1d21c;border-radius:99px;box-shadow:inset 0 1px 2px #0009;overflow:visible}
.trk b{background:linear-gradient(90deg,#87602b,#d5ad5b,#fff0ba);box-shadow:0 0 10px #d4ae5b77}
.trk span{filter:drop-shadow(0 0 5px #f5d887);top:-10px}
.cash{padding:7px 10px;border:1px solid #a98549;border-radius:2px;background:linear-gradient(145deg,#2d2116,#110d09);color:#f1d38a;font-size:16px;box-shadow:inset 0 1px 0 #fff2d41a,0 5px 14px #0004}
.mu{background:linear-gradient(#39291b,#1b120d);color:#e7c982;border-color:#8d6b3a}
.msg{color:#cdb991;min-height:30px;font-size:13px;letter-spacing:.1px}
.fact{margin:0 0 12px;padding:11px 13px;border:1px solid #8e6b3c;border-left:3px solid #d6b66f;background:linear-gradient(110deg,#33251a,#1c1510);color:#ead9b8;box-shadow:0 8px 20px #0004}
.fact.ok{border-left-color:#8cae80}.fact.no{border-left-color:#c87569}
.scene{
  position:relative;isolation:isolate;overflow:hidden;padding:16px 14px 18px;
  border:1px solid #bd9857;border-radius:3px;
  background:

CLAIMS.push(
{n:'มงกุฏเพชร',e:'',min:800,max:1500,ok:true,c:'มงกุฏเพชรสไตล์วิกตอเรียน ทำราวปี 1880',why:'สมัยวิกตอเรียคือปี 1837–1901 และมงกุฏเพชรเป็นที่นิยมในราชสำนักอังกฤษยุคนั้น'},
{n:'มงกุฏเพชร',e:'',min:800,max:1500,ok:false,c:'เพชรเจียระไนทรงบริลเลียนต์ ของพระนางคลีโอพัตรา',why:'คลีโอพัตราสิ้นพระชนม์ 30 ปีก่อน ค.ศ. ส่วนการเจียระไนทรงบริลเลียนต์พัฒนาในศตวรรษที่ 17–18'},
{n:'แหวนมรกต',e:'',min:600,max:1200,ok:true,c:'แหวนมรกตสไตล์อาร์ตเดโค ทำราวปี 1925',why:'อาร์ตเดโคเฟื่องฟูช่วงทศวรรษ 1920 เด่นเรื่องรูปทรงเรขาคณิต และนิยมมรกตกับเพชร'},
{n:'แหวนมรกต',e:'',min:600,max:1200,ok:false,c:'แหวนมรกตสไตล์อาร์ตเดโค ของพระเจ้าหลุยส์ที่ 14',why:'พระเจ้าหลุยส์ที่ 14 สิ้นพระชนม์ปี 1715 แต่อาร์ตเดโคเกิดในทศวรรษ 1920'},
{n:'กำไลหยก',e:'',min:400,max:900,ok:true,c:'กำไลหยกสมัยราชวงศ์ชิง ราวปี 1750',why:'ราชวงศ์ชิงปกครองจีนปี 1644–1912 และชาวจีนนิยมสวมกำไลหยกเป็นของมงคล'},
{n:'กำไลหยก',e:'',min:400,max:900,ok:false,c:'กำไลหยกสมัยราชวงศ์ถัง สลักปี ค.ศ. 1850',why:'ราชวงศ์ถังสิ้นสุดปี 907 ส่วนปี 1850 อยู่สมัยราชวงศ์ชิง'},
{n:'ปิ่นทองหงส์',e:'',min:400,max:900,ok:true,c:'ปิ่นปักผมทองลายหงส์ สมัยราชวงศ์หมิง ศตวรรษที่ 16',why:'ราชวงศ์หมิงปกครองปี 1368–1644 หงส์เป็นสัญลักษณ์ของจักรพรรดินี และปิ่นทองประดับไข่มุกเป็นของชั้นสูง'},
{n:'จี้ทองเทพสุริยะ',e:'',min:600,max:1200,ok:true,c:'จี้ทองคำรูปเทพสุริยะอินติของอินคา ทำก่อนปี 1532',why:'อินคารุ่งเรืองราวปี 1438–1533 บูชาอินติเทพสุริยะ และสเปนเริ่มพิชิตเปรูปี 1532'},
{n:'จี้ทองเทพสุริยะ',e:'',min:600,max:1200,ok:false,c:'จี้ทองคำอินคา ที่ช่างอินคาทำขึ้นในปี 1700',why:'จักรวรรดิอินคาล่มสลายหลังสเปนพิชิตปี 1532–1533 ปี 1700 เป็นยุคอาณานิคมสเปน'},
{n:'จี้ไข่มุกทับทิม',e:'',min:500,max:1000,ok:true,c:'จี้ไข่มุกบาโรกประดับทับทิม สมัยเรอเนสซองส์ ศตวรรษที่ 16',why:'เรอเนสซองส์อยู่ราวศตวรรษที่ 14–17 ราชสำนักยุโรปนิยมจี้ไข่มุกทรงบาโรกที่ประดับทองและอัญมณี'}
);
const ico=(it,z)=>`<svg viewBox='0 0 100 100' width='${z}' height='${z}' aria-hidden='true'><g filter='url(#${z>=100?'fLux':'fShine'})'>${ART[K[it.n]]||''}</g></svg>`;
const AV=["👵","🧓","👨‍🦳","👩‍🦰","🧔","👲","🧕","👷","🕵️","🧑‍🎨"];
const SAY=["สวัสดีครับเถ้าแก่ ผมมีของดีมาเสนอ","ของที่บ้านคุณปู่ ดูหน่อยนะ","เจอในโกดังเก่า สภาพยังดีอยู่เลย","ช่วยดูหน่อยครับ ว่าพอมีค่าไหม"];
const WANT=["ได้ยินว่าร้านนี้มีของน่าสนใจ","ผมตามหาชิ้นนี้มานานแล้ว","ขอซื้อไปตั้งโชว์ที่บ้านครับ"];
const R=(a,b)=>Math.round(a+Math.random()*(b-a)),P=a=>a[R(0,a.length-1)];
const f=n=>"฿"+Math.round(n).toLocaleString("th-TH");
let s,mute=false,AC;
function tn(fr,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function snd(fn){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();fn(AC.currentTime)}catch(e){}}
function coin(v){const n=v>=800?4:v>=400?3:2;snd(t=>{for(let i=0;i<n;i++){const d=t+i*.11;tn(988,d,.07,"square",.08);tn(1319,d+.06,.3,"square",.08);tn(2637,d+.06,.18,"sine",.04)}})}
function bad(){snd(t=>{tn(180,t,.25,"sawtooth",.08);tn(120,t+.15,.3,"sawtooth",.08)})}
function tg(){mute=!mute;render()}
let shopName='';
function naming(){document.getElementById('sn').textContent='Antiques';document.getElementById('app').innerHTML=`<div class='scene end'><div class='nm'>ตั้งชื่อร้านของคุณ</div><p class='sub'>ชื่อนี้จะขึ้นบนป้ายหน้าร้าน</p><input id='nmi' maxlength='26' placeholder='เช่น Old Oak Antiques'><div class='btns'><button class='p' onclick='openShop()'>เปิดร้าน</button></div></div>`}
function openShop(){shopName=document.getElementById('nmi').value.trim()||'Old Oak Antiques';begin()}
function start(){if(!shopName){naming();return}begin()}
function begin(){document.getElementById('sn').textContent=shopName;s={day:1,cash:1000,inv:[],q:{ok:0,n:0},fact:null,msg:"ยินดีต้อนรับสู่ร้านของคุณ! ซื้อถูก ขายแพง และอย่าลืมค่าเช่าทุกสัปดาห์",done:false};s.ev=gen();render()}
function gen(){
  const av=R(0,9999);
  if(s.inv.length&&Math.random()<0.45){
    const i=R(0,s.inv.length-1),it=s.inv[i];
    return{t:"buy",av,say:P(WANT),i,it,offer:Math.round(it.value*(0.6+Math.random()))};
  }
  if(Math.random()<0.45){
    const c=P(CLAIMS),base=R(c.min,c.max);
    return{t:"sell",av,say:P(SAY),claim:c,it:{n:c.n,e:c.e,value:c.ok?Math.round(base*1.3):Math.round(base*0.08),fake:!c.ok},est:base,ask:Math.round(base*(0.5+Math.random()*0.7))};
  }
  const b=P(ITEMS),base=R(b[2],b[3]),fake=Math.random()<0.15;
  return{t:"sell",av,say:P(SAY),it:{n:b[0],e:b[1],value:fake?Math.round(base*0.1):base,fake},est:base,ask:Math.round(base*(0.4+Math.random()*0.9))};
}
function next(m,fx){
  s.msg=m;s.fx=fx;
  if(s.day%7==0){s.cash-=100;s.msg+=" · จ่ายค่าเช่าร้าน −฿100"}
  s.day++;
  if(s.day>30){s.done=true}else{s.ev=gen()}
  render();
}
function judge(e,bought){
  const c=e.claim;if(!c)return;
  const right=bought===c.ok;s.q.n++;if(right)s.q.ok++;
  s.fact={ok:right,t:(right?"✅ ตัดสินใจถูก! ":"❌ พลาด! ")+(c.ok?"ข้ออ้างนี้สมเหตุสมผล: ":"ข้ออ้างนี้ขัดกับประวัติศาสตร์: ")+c.why};
  if(bought&&!c.ok)bad();
}
function act(a){
  const e=s.ev,it=e.it;s.fact=null;
  if(e.t=="sell"){
    if(a=="yes"){judge(e,true);s.cash-=e.ask;it.paid=e.ask;s.inv.push(it);next("ซื้อ"+it.n+"ไว้ในราคา "+f(e.ask),{t:"−"+f(e.ask),c:"bad"})}
    else if(a=="hag"){
      if(Math.random()<0.55){e.ask=Math.round(e.ask*0.8);e.hag=1;s.msg="เขายอมลดให้แล้ว!";s.fx={t:"ลดแล้ว! 🎉",c:"good"};render()}
      else{if(e.claim)s.fact={ok:null,t:"📜 "+e.claim.why};next("ต่อมากไป เจ้าของของเดินหนีไปแล้ว",{t:"เดินหนี 💨",c:"bad"})}
    } else{judge(e,false);next("ปฏิเสธไป ไม่เสียอะไร")}
  } else {
    if(a=="yes"){coin(e.offer);s.cash+=e.offer;s.inv.splice(e.i,1);next("ขาย"+it.n+"ได้ "+f(e.offer)+" (ทุน "+f(it.paid)+")",{t:"+"+f(e.offer)+" 🪙",c:"good"})}
    else if(a=="hag"){
      if(Math.random()<0.5){e.offer=Math.round(e.offer*1.2);e.hag=1;s.msg="ลูกค้ายอมเพิ่มให้!";s.fx={t:"เพิ่มให้! 🎉",c:"good"};render()}
      else next("ขอเยอะไป ลูกค้าเดินออกจากร้าน",{t:"เดินหนี 💨",c:"bad"})
    } else next("ไม่ขาย เก็บไว้ก่อน")
  }
}
function shelf(){
  const n=Math.max(8,Math.ceil(s.inv.length/4)*4);let h="";
  for(let r=0;r<n/4;r++){h+='<div class="row">';
    for(let c=0;c<4;c++){const i=s.inv[r*4+c];h+=i?`<div class="slot" title="${i.n}">${ico(i,40)}<small>ทุน ${f(i.paid)}</small></div>`:'<div class="slot e">·</div>'}
    h+="</div>"}
  return`<div class="shelf"><h3>🪵 ชั้นวางของ (${s.inv.length} ชิ้น)</h3>${h}</div>`;
}
function render(){
  const a=document.getElementById("app");
  if(s.done){
    const stock=s.inv.reduce((x,i)=>x+i.value*0.5,0),tot=s.cash+stock,p=tot-1000;
    const t=p<0?["😵","เจ๊งยับ"]:p<500?["🙂","พอเลี้ยงตัว"]:p<1500?["😎","เถ้าแก่มือใหม่"]:["👑","เซียนของเก่า"];
    a.innerHTML=`<div class="scene end"><div class="big">${t[0]}</div><div class="nm">ครบ 30 วัน! ${t[1]}</div><p class="sub">เงินสด ${f(s.cash)}<br>ของในร้าน ${s.inv.length} ชิ้น (ตีราคาครึ่งหนึ่ง ${f(stock)})</p><div class="tag">รวม ${f(tot)}</div><p class="sub">กำไรสุทธิ ${f(p)}</p><p class="sub">🎓 คะแนนประวัติศาสตร์ ${s.q.ok}/${s.q.n}</p><div class="btns"><button class="p" onclick="start()">เปิดร้านใหม่อีกครั้ง</button><button onclick="shopName='';start()">ตั้งชื่อร้านใหม่</button></div></div>${shelf()}`;
    return;
  }
  const e=s.ev,it=e.it,rare=(e.t=="sell"?e.est>=700:(it.value>=700&&!it.fake))||['tiara','ring','jade','pin','inca','pend','pot','gold'].includes(K[it.n]);
  const sp=rare?'<i class="sp" style="left:22%;top:18%">✨</i><i class="sp" style="right:22%;top:30%;animation-delay:.6s">✨</i><i class="sp" style="left:30%;top:62%;animation-delay:1.1s">✨</i>':"";
  const info=e.t=="sell"?`มีคนเอามาขาย · คาดว่ามีค่า ${f(e.est*0.7)}–${f(e.est*1.3)}<br>ระวังของปลอมนะ`:`ลูกค้าอยากได้ชิ้นนี้ · คุณซื้อมา ${f(it.paid)}`;
  const tag=e.t=="sell"?"ขอ "+f(e.ask):"เสนอ "+f(e.offer);
  const btn=e.t=="sell"?`<button class="p" onclick="act('yes')" ${s.cash<e.ask?"disabled":""}>ซื้อ</button><button onclick="act('hag')" ${e.hag?"disabled":""}>ต่อรอง (ลด 20%)</button><button onclick="act('no')">ไม่ซื้อ</button>`:`<button class="p" onclick="act('yes')">ขาย</button><button onclick="act('hag')" ${e.hag?"disabled":""}>ขอเพิ่ม (+20%)</button><button onclick="act('no')">ไม่ขาย</button>`;
  const tr=(s.day-1)/29*100;
  const cert=e.claim?`<div class="cert">📜 ผู้ขายอ้างว่า: “${e.claim.c}”</div>`:"";
  a.innerHTML=`<div class="stat"><div class="day">📅 วันที่ ${s.day}/30<div class="trk"><b style="width:${tr}%"></b><span style="left:${tr}%">☀️</span></div></div><button class="mu" onclick="tg()">${mute?"🔇":"🔊"}</button><div class="cash" style="${s.cash<0?"color:var(--bad)":""}">🪙 ${f(s.cash)}</div></div><div class="msg">${s.msg}</div>${s.fact?`<div class="fact ${s.fact.ok===true?"ok":s.fact.ok===false?"no":""}">${s.fact.t}</div>`:""}<div class="scene" id="sc">${sp}<div class="cus"><div class="av">${portrait(e.av)}</div><div class="bub">“${e.say}”</div></div><div class="stage"><span class="it">${ico(it,124)}</span><div class="ped"></div><div class="nm">${it.n}</div><div class="sub">${info}</div>${cert}<div class="tag">${tag}</div></div><div class="btns">${btn}</div></div>${shelf()}<div class="foot">ค่าเช่าร้าน ฿100 ทุกวันที่ 7, 14, 21, 28</div>`;
  if(s.fx){const p=document.createElement("div");p.className="pop "+s.fx.c;p.textContent=s.fx.t;document.getElementById("sc").appendChild(p);s.fx=null}
}
start();
</script>
